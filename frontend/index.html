<!DOCTYPE html>
<!-- The app is dark-only; the class is set here so every route gets it,
     not just the ones the chatbot happened to run its theme effect on. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- interactive-widget: since Chrome 108 the Android keyboard only resizes the
         visual viewport, so a 100dvh layout keeps its height and the keyboard
         opens over the chat composer. This makes the keyboard shrink the
         layout instead, so the composer sits directly above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030712" />

    <!-- index.css has always asked for Inter and nothing ever fetched it, so
         the app rendered in the system fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="google-site-verification" content="1UpHMajCLJISBerWywJuL9Qa6Lux3RHXe3k6IBrmVNY" />
    <meta name="msvalidate.01" content="7F4C5D26D211FB92C876A48B2F0225CC" />

    <!--seo-head-->

    <meta name="author" content="CodeQuest101" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
